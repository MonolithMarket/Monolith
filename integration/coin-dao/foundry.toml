[profile.default]
src = "../../lib/monolith-governance/src"
out = "out"
libs = ["../../lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
dynamic_test_linking = false
# Full compiler output includes deployable artifacts for every implementation.
build_info = true
remappings = [
  "coin-dao/=../../lib/monolith-governance/src/",
  "@openzeppelin/contracts/=../../lib/monolith-governance/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=../../lib/monolith-governance/lib/openzeppelin-contracts-upgradeable/contracts/"
]
